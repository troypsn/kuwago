name: Android CI/CD

on:
  push:
    branches:
      - main
      - test_mobsf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test and Release APK
    runs-on: ubuntu-latest

    env:
      API_URL: "https://kwago-backend.vercel.app/"
      FALLBACK_API_URL: "https://kwagobackend.onrender.com/"
      KWAGO_API_KEY: ${{ secrets.KWAGO_API_KEY }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Start MobSF Container (Background)
        run: |
          docker run -d --name mobsf \
            -p 8000:8000 \
            -e MOBSF_API_KEY="mobsf-ci-key" \
            opensecurity/mobile-security-framework-mobsf:latest

      - name: Install patchelf and aarch64 strip for Native Binary Hardening
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils-aarch64-linux-gnu

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore app/release.keystore \
            -alias kuwago_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kuwago_release_pass \
            -keypass kuwago_release_pass \
            -dname "CN=Kuwago Security, OU=Mobile, O=Kuwago, L=Manila, S=NCR, C=PH"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Wait for MobSF Container
        run: |
          echo "Waiting for MobSF to be ready..."
          timeout 120s bash -c 'until curl -s http://localhost:8000/api/v1/docs > /dev/null; do sleep 3; done'
          echo "MobSF is operational!"

      - name: Run MobSF Static Analysis on APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          API_KEY="mobsf-ci-key"

          echo "1. Uploading APK to MobSF..."
          UPLOAD_RESP=$(curl -s -F "file=@$APK_PATH" -H "Authorization: $API_KEY" http://localhost:8000/api/v1/upload)
          HASH=$(echo "$UPLOAD_RESP" | jq -r '.hash')

          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "MobSF upload failed: $UPLOAD_RESP"
            exit 1
          fi
          echo "APK Uploaded successfully. Hash: $HASH"

          echo "2. Scanning APK..."
          curl -s -X POST http://localhost:8000/api/v1/scan \
            -H "Authorization: $API_KEY" \
            --data "hash=$HASH" > /dev/null

          echo "3. Exporting JSON & PDF reports..."
          curl -s -X POST http://localhost:8000/api/v1/report_json \
            -H "Authorization: $API_KEY" \
            --data "hash=$HASH" -o mobsf-report.json

          curl -s -X POST http://localhost:8000/api/v1/download_pdf \
            -H "Authorization: $API_KEY" \
            --data "hash=$HASH" -o mobsf-report.pdf

          SCORE=$(jq -r '.security_score // "N/A"' mobsf-report.json)
          echo "=========================================="
          echo " MobSF Security Score: $SCORE / 100"
          echo "=========================================="

      - name: Upload MobSF Reports as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobsf-security-reports
          path: |
            mobsf-report.pdf
            mobsf-report.json
          if-no-files-found: warn

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release and Upload Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test_mobsf'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }} (${{ github.ref_name }})
          body: |
            Automatically generated release from push to `${{ github.ref_name }}` branch.
            
            ### Artifacts
            * **Signed Release APK**: `app-release.apk` (R8-minified, symbol-stripped, arm64-v8a release build)
            * **Security Report**: `mobsf-report.pdf` & `mobsf-report.json` (Automated MobSF SAST security audit report)
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            mobsf-report.pdf
            mobsf-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}